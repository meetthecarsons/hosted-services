services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    network_mode: service:tailscale  # Share network with Tailscale container for localhost access
    environment:
      - PUID=${PUID:-2000} # apps service user (override in .env)
      - PGID=${PGID:-2000}
      - TZ=${TZ}
    volumes:
      - ${ABS_CONFIG}:/config
      - ${ABS_METADATA}:/metadata
      - ${ABS_AUDIOBOOKS}:/audiobooks
      - ${ABS_PODCASTS}:/podcasts
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    container_name: audiobookshelf-ts
    hostname: audiobooks  # Hostname for this node on the tailnet
    restart: unless-stopped
    environment:
      - TS_AUTH_KEY=${TS_AUTH_KEY}  # Tailscale auth key for auto-login
      - TS_EXTRA_ARGS=--advertise-tags=tag:containers
      - TS_STATE_DIR=/var/lib/tailscale  # Persistent state directory
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - audiobookshelf-ts:/var/lib/tailscale  # Persistent state
      - /dev/net/tun:/dev/net/tun  # Required for Tailscale
      - ./ts-serve.json:/config/serve.json:ro
    ports:
      - "${ABS_PORT}:80"  # allow direct LAN clients to reach Audiobookshelf
    cap_add:
      - NET_ADMIN  # Required for Tailscale to manage network interfaces

volumes:
  audiobookshelf-ts:
    driver: local
