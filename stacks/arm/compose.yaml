services:
  # Renders arm.yaml and apprise.yaml from their templates, substituting
  # secrets/host identity from the env. Runs once per `up`; arm waits for it.
  arm-config:
    image: busybox:latest
    container_name: arm-config
    environment:
      - ARM_NAME=${ARM_NAME}
      - MAKEMKV_PERMA_KEY=${MAKEMKV_PERMA_KEY}
      - OMDB_API_KEY=${OMDB_API_KEY}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - ARM_UID=${ARM_UID}
      - ARM_GID=${ARM_GID}
    volumes:
      - ./config:/in:ro
      - arm-config:/out
    command: >
      sh -c '
      for f in arm.yaml apprise.yaml; do
        sed "s|__ARM_NAME__|$${ARM_NAME}|; s|__MAKEMKV_PERMA_KEY__|$${MAKEMKV_PERMA_KEY}|; s|__OMDB_API_KEY__|$${OMDB_API_KEY}|; s|__TMDB_API_KEY__|$${TMDB_API_KEY}|; s|__NTFY_TOPIC__|$${NTFY_TOPIC}|" /in/$$f.tpl > /out/$$f;
      done;
      cp /in/abcde.conf /out/abcde.conf;
      chown -R $${ARM_UID}:$${ARM_GID} /out
      '
    restart: "no"

  arm:
    # locally-built custom image (repos/automatic-ripping-machine +
    # repos/arm-dependencies in the outer homelab repo, homelab-patches
    # branch): fixes the TMDB metadata_selector bug and adds Intel QSV
    # support. Built directly on crafty (docker build -t arm:homelab),
    # no registry involved - pull_policy: never so compose doesn't try to
    # pull a nonexistent remote image.
    image: arm:homelab
    pull_policy: never
    container_name: arm
    restart: unless-stopped
    # grants access to every host device (incl. whichever /dev/sr*+/dev/sg*
    # this host has) — required anyway for ARM's internal udev daemon to see
    # disc-insert events, and makes explicit per-drive `devices:` entries
    # unnecessary
    privileged: true
    depends_on:
      arm-config:
        condition: service_completed_successfully
    environment:
      ARM_UID: ${ARM_UID}
      ARM_GID: ${ARM_GID}
      TZ: ${TZ}
    volumes:
      - ${ARM_HOME}:/home/arm
      - ${ARM_MUSIC}:/home/arm/music
      - ${ARM_LOGS}:/home/arm/logs
      - ${ARM_MEDIA}:/home/arm/media
      - arm-config:/etc/arm/config
    ports:
      - "${ARM_PORT}:8080"

volumes:
  arm-config:
    driver: local
