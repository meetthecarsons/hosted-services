services:
  # Ensures MakeMKV's own settings.conf sets an output-filename template of
  # just the track number ({AM2} - MakeMKV's own C1_t00.mkv-style fallback
  # naming is what happens with no template at all). The <disc label> prefix
  # is deliberately NOT done via MakeMKV's own {NAME1} token - that reads a
  # disc-internal metadata field which is empty on some discs (confirmed:
  # DVDs in this household's "My Life is Murder" S2 set), silently dropping
  # the prefix. disc_rip_terminated.sh adds it instead, using the disc label
  # jlesage itself passes in - reliably the same thing that named the
  # folder, unlike MakeMKV's internal metadata.
  # Also copies the hook scripts into
  # /config/hooks rather than bind-mounting ./hooks there directly - jlesage's
  # entrypoint chowns everything under /config to MAKEMKV_UID/GID on startup,
  # which (via a direct bind mount) reaches through to the host and leaves
  # the git-managed ./hooks files un-rsync-able by the deploying user on the
  # next `make deploy`. Copying instead of mounting keeps ./hooks untouched.
  # Runs once per `up`.
  makemkv-config:
    image: busybox:latest
    container_name: makemkv-config
    environment:
      - MAKEMKV_UID=${MAKEMKV_UID}
      - MAKEMKV_GID=${MAKEMKV_GID}
    volumes:
      - ${MAKEMKV_CONFIG}:/config
      - ./hooks:/hooks-src:ro
    command: >
      sh -c '
      mkdir -p /config/.MakeMKV /config/hooks;
      touch /config/.MakeMKV/settings.conf;
      if grep -q "^app_DefaultOutputFileName" /config/.MakeMKV/settings.conf; then
        sed -i "s|^app_DefaultOutputFileName.*|app_DefaultOutputFileName = \"{AM2}\"|" /config/.MakeMKV/settings.conf;
      else
        echo "app_DefaultOutputFileName = \"{AM2}\"" >> /config/.MakeMKV/settings.conf;
      fi;
      cp /hooks-src/*.sh /config/hooks/;
      chmod +x /config/hooks/*.sh;
      chown -R $${MAKEMKV_UID}:$${MAKEMKV_GID} /config/hooks
      '
    restart: "no"

  makemkv:
    # jlesage/docker-makemkv: watches attached optical drives and rips
    # automatically on insert (AUTO_DISC_RIPPER=1). Rip-only — this
    # container only produces raw MKVs; identification, renaming, and
    # transcoding happen downstream, not here.
    image: jlesage/makemkv:latest
    container_name: makemkv
    restart: unless-stopped
    depends_on:
      makemkv-config:
        condition: service_completed_successfully
    devices:
      - ${MAKEMKV_DEVICE_SR}:${MAKEMKV_DEVICE_SR}
      - ${MAKEMKV_DEVICE_SG}:${MAKEMKV_DEVICE_SG}
    environment:
      - USER_ID=${MAKEMKV_UID}
      - GROUP_ID=${MAKEMKV_GID}
      - TZ=${TZ}
      - MAKEMKV_KEY=${MAKEMKV_KEY}
      - AUTO_DISC_RIPPER=1
      - AUTO_DISC_RIPPER_EJECT=1
      - AUTO_DISC_RIPPER_MIN_TITLE_LENGTH=${MAKEMKV_MIN_TITLE_LENGTH}
      # read by ./hooks/*.sh (ntfy notifications on rip start/finish)
      - MAKEMKV_HOST_LABEL=${MAKEMKV_HOST_LABEL}
      - NTFY_TOPIC_READY=${NTFY_TOPIC_READY}
    volumes:
      - ${MAKEMKV_CONFIG}:/config
      - ${MAKEMKV_OUTPUT}:/output
      - ${MAKEMKV_COMPLETED}:/completed
    ports:
      - "${MAKEMKV_PORT}:5800"
