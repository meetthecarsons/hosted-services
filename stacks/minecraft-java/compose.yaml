services:
  minecraft:
    image: itzg/minecraft-server
    pull_policy: always
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      MODRINTH_LOADER: "fabric"
      # simple-voice-chat only ships beta builds for 26.x, hence the :beta pin
      MODRINTH_PROJECTS: "fabric-api,worldedit,simple-voice-chat:beta"
      VERSION: ${VERSION}
      DIFFICULTY: ${DIFFICULTY}
      MODE: ${MODE}
      LEVEL: ${LEVEL:-world}
      LEVEL_TYPE: ${LEVEL_TYPE:-DEFAULT}
      MAX_PLAYERS: ${MAX_PLAYERS}
      OPS: ${OPS}
      WHITELIST: ${WHITELIST}
      INIT_MEMORY: ${INIT_MEMORY}
      MAX_MEMORY: ${MAX_MEMORY}
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD}
    ports:
      - "25565:25565"
      - "25575:25575"
      - "24454:24454/udp"
    volumes:
      - ${DATA_DIR}:/data
    stdin_open: true
    tty: true
